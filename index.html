Nadim Foundation - مؤسسة نديم
</title>

<meta
  name="theme-color"
  content="#06444C"
  media="(prefers-color-scheme: dark)"
>

<meta
  name="theme-color"
  content="#EAE8D8"
  media="(prefers-color-scheme: light)"
>

<link
  rel="icon"
  type="image/svg+xml"
  href="https://raw.githubusercontent.com/ND-F/Q/main/images/icon-nadim-light.svg?v=2"
  media="(prefers-color-scheme: dark)"
>

<link
  rel="icon"
  type="image/svg+xml"
  href="https://raw.githubusercontent.com/ND-F/Q/main/images/icon-nadim.svg?v=2"
  media="(prefers-color-scheme: light)"
>

<link
  rel="apple-touch-icon"
  href="https://raw.githubusercontent.com/ND-F/Q/main/images/icon-nadim-light.svg?v=2"
>

<link
  href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800;900&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>

<style>

:root{

  --main:#06444C;

  --light:#EAE8D8;

  --gold:#E1A93E;

  --accent:#ADCAC9;

  --darkred:#4A121C;

}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;
  padding:0;

  font-family:'Tajawal',sans-serif;

  font-weight:500;

  text-align:center;

  background:var(--main);

  color:var(--light);

  overflow-x:hidden;

  padding-bottom:
    calc(
      120px +
      env(safe-area-inset-bottom)
    );

  transition:
    background .45s ease,
    color .45s ease;

  -webkit-font-smoothing:
    antialiased;

}

/* ========================================== */
/* GLOBAL PATTERN */
/* ========================================== */

body::before{

  content:"";

  position:fixed;

  inset:0;

  background-image:
    url(
      'https://raw.githubusercontent.com/ND-F/Q/main/images/icon-nadim-light.svg?v=2'
    );

  background-size:
    55px 55px;

  background-position:center;

  opacity:.10;

  pointer-events:none;

  z-index:-1;

  transition:
    opacity .45s ease,
    background-image .45s ease;

}

body.light::before{

  background-image:
    url(
      'https://raw.githubusercontent.com/ND-F/Q/main/images/icon-nadim.svg?v=2'
    );

  opacity:.08;

}

/* ========================================== */
/* LIGHT MODE */
/* ========================================== */

body.light{

  background:var(--light);

  color:var(--main);

}

/* ========================================== */
/* HEADER */
/* ========================================== */

.logoStrip{

  position:fixed;

  top:0;
  left:0;

  width:100%;

  z-index:1000;

  overflow:hidden;

  background:
    rgba(234,232,216,0.96);

  border-bottom:
    2px solid
    rgba(225,169,62,0.72);

  box-shadow:
    0 6px 30px rgba(0,0,0,0.20);

  transition:
    all .45s
    cubic-bezier(
      .175,
      .885,
      .32,
      1.275
    );

}

.logoStrip::before{

  content:"";

  position:absolute;

  inset:0;

  background-image:
    url(
      'https://raw.githubusercontent.com/ND-F/Q/main/images/icon-nadim.svg?v=2'
    );

  background-size:
    36px 36px;

  opacity:.10;

  pointer-events:none;

}

.logoStrip > *{

  position:relative;

  z-index:2;

}

.logoWrap{

  min-height:150px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:
    24px 30px;

}

.logo{

  width:260px;

  transition:
    width .45s
    cubic-bezier(
      .175,
      .885,
      .32,
      1.275
    );

}

.logoStrip.shrink{

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

}

.logoStrip.shrink .logo{

  width:170px;

}

/* ========================================== */
/* PAGE WRAPPER */
/* ========================================== */

.pageWrapper{

  padding-top:170px;

}

/* ========================================== */
/* GRID */
/* ========================================== */

.iconGrid{

  width:92%;

  max-width:500px;

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:24px;

  justify-items:center;

  direction:ltr !important;

}

/* ========================================== */
/* PREMIUM GLASS CARDS */
/* ========================================== */

.iconBtn{

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  width:96px;
  height:96px;

  border-radius:30px;

  overflow:hidden;

  isolation:isolate;

  text-decoration:none;

  color:var(--light);

  border:
    1px solid
    rgba(255,255,255,0.04);

  background:
    linear-gradient(
      145deg,
      rgba(10,22,25,0.88),
      rgba(5,14,16,0.96)
    );

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    0 12px 30px rgba(0,0,0,0.28),
    inset 0 1px 0 rgba(255,255,255,0.03);

  transition:
    transform .55s cubic-bezier(.175,.885,.32,1.275),
    background .45s ease,
    color .45s ease,
    border-color .45s ease,
    box-shadow .45s ease;

}

/* reflective layer */

.iconBtn::after{

  content:"";

  position:absolute;

  inset:0;

  background:
    radial-gradient(
      circle at top left,
      rgba(255,255,255,0.06),
      transparent 42%
    );

  opacity:.75;

  pointer-events:none;

  z-index:0;

}

/* tooltip */

.iconBtn::before{

  content:attr(data-tooltip);

  position:absolute;

  bottom:125%;
  left:50%;

  transform:
    translateX(-50%)
    translateY(12px);

  background:
    rgba(10,30,35,0.82);

  color:var(--gold);

  padding:
    10px 16px;

  border-radius:14px;

  font-size:14px;
  font-weight:800;

  white-space:nowrap;

  opacity:0;
  visibility:hidden;

  pointer-events:none;

  backdrop-filter:
    blur(14px);

  -webkit-backdrop-filter:
    blur(14px);

  border:
    1px solid
    rgba(225,169,62,0.18);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.30);

  transition:
    .35s cubic-bezier(.175,.885,.32,1.275);

  z-index:9999;

}

.iconBtn:hover::before{

  opacity:1;
  visibility:visible;

  transform:
    translateX(-50%)
    translateY(0);

}

/* icon layer */

.iconBtn i,
.iconBtn img,
.iconBtn span{

  position:relative;

  z-index:2;

  transition:
    transform .45s ease,
    color .45s ease;

}

/* hover */

.iconBtn:hover{

  transform:
    translateY(-10px)
    scale(1.11);

  color:var(--gold) !important;

  border-color:
    rgba(225,169,62,0.65);

  background:
    linear-gradient(
      145deg,
      rgba(12,26,30,0.92),
      rgba(7,18,20,0.98)
    );

  box-shadow:
    0 22px 45px rgba(0,0,0,0.45),
    0 0 0 1px rgba(225,169,62,0.14);

}

.iconBtn:hover i,
.iconBtn:hover img{

  transform:
    scale(1.08);

}

/* active */

.iconBtn:active{

  transform:
    translateY(-4px)
    scale(1.06);

}

/* gold line */

.goldLine{

  position:absolute;

  bottom:0;
  left:0;

  width:0;
  height:2px;

  background:var(--gold);

  transition:
    width .55s ease;

  z-index:5;

}

.iconBtn:hover .goldLine{

  width:100%;

}

/* ========================================== */
/* FULL WIDTH BUTTONS */
/* ========================================== */

.full-width-btn{

  grid-column:1 / span 3;

  width:100%;
  height:92px;

  gap:18px;

  font-size:18px;
  font-weight:800;

}

.full-width-btn span{

  position:relative;

  z-index:3;

  letter-spacing:.03em;

}

.full-width-btn img,
.full-width-btn i{

  position:relative;

  z-index:3;

}

/* ========================================== */
/* ICONS */
/* ========================================== */

.newsletter i{

  font-size:42px;

}

.siteLogo{

  height:72px;

  width:auto;

}

.light-logo{

  display:none;

}

.dark-logo{

  display:block;

}

.light .light-logo{

  display:block;

}

.light .dark-logo{

  display:none;

}

/* ========================================== */
/* MAP */
/* ========================================== */

.map{

  margin:55px auto;

  width:92%;
  max-width:500px;

  height:190px;

  border-radius:30px;

  overflow:hidden;

  border:
    2px solid
    rgba(225,169,62,0.72);

  box-shadow:
    0 18px 40px rgba(0,0,0,0.25);

  display:block;

  cursor:pointer;

}

.map iframe{

  width:100%;
  height:100%;

  border:0;

  pointer-events:none;

}

/* ========================================== */
/* CONTROLS */
/* ========================================== */

.controls{

  position:fixed;

  bottom:
    calc(
      25px +
      env(safe-area-inset-bottom)
    );

  left:50%;

  transform:
    translateX(-50%);

  z-index:3000;

  display:flex;
  align-items:center;

  gap:0;

  height:84px;

  padding:
    0 26px;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #041f24,
      #063842
    );

  border:
    2px solid
    rgba(225,169,62,0.78);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  box-shadow:
    0 10px 40px rgba(0,0,0,0.35);

  transition:
    transform .35s ease,
    opacity .35s ease,
    bottom .35s ease;

}

.controls::before{

  content:"";

  position:absolute;

  inset:0;

  border-radius:999px;

  background:
    radial-gradient(
      circle at top left,
      rgba(255,255,255,0.05),
      transparent 42%
    );

  pointer-events:none;

}

/* divider */

.ctrlDivider{

  width:1px;

  height:34px;

  background:
    rgba(225,169,62,0.35);

  margin:0 14px;

}

/* buttons */

.controls div{

  width:62px;
  height:62px;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;

  border-radius:50%;

  cursor:pointer;

  font-size:28px;

  color:var(--gold);

  transition:
    .35s cubic-bezier(
      .175,
      .885,
      .32,
      1.275
    );

}

.controls div:hover{

  transform:
    translateY(-2px)
    scale(1.08);

  background:
    rgba(225,169,62,0.08);

}

/* tooltips */

.controls div::before{

  content:attr(data-tooltip);

  position:absolute;

  bottom:125%;
  left:50%;

  transform:
    translateX(-50%)
    translateY(10px);

  background:
    rgba(10,30,35,0.82);

  color:var(--gold);

  padding:
    8px 15px;

  border-radius:14px;

  font-size:14px;
  font-weight:800;

  white-space:nowrap;

  opacity:0;
  visibility:hidden;

  pointer-events:none;

  backdrop-filter:
    blur(14px);

  -webkit-backdrop-filter:
    blur(14px);

  border:
    1px solid
    rgba(225,169,62,0.18);

  transition:
    .35s cubic-bezier(.175,.885,.32,1.275);

}

.controls div:hover::before{

  opacity:1;
  visibility:visible;

  transform:
    translateX(-50%)
    translateY(0);

}

/* mini mode */

.controls.controls-mini{

  transform:
    translateX(-50%)
    scale(.86);

  opacity:.50;

  bottom:
    calc(
      14px +
      env(safe-area-inset-bottom)
    );

}

.controls.controls-mini:hover{

  transform:
    translateX(-50%)
    scale(1);

  opacity:1;

}

/* ========================================== */
/* LIGHT MODE */
/* ========================================== */

.light .iconBtn{

  color:var(--main);

  border:
    1px solid
    rgba(0,0,0,0.04);

  background:
    rgba(248,244,236,0.78);

  box-shadow:
    0 10px 25px rgba(0,0,0,0.05),
    inset 0 1px 0 rgba(255,255,255,0.55);

}

.light .iconBtn::after{

  background:
    radial-gradient(
      circle at top left,
      rgba(255,255,255,0.45),
      transparent 42%
    );

}

.light .iconBtn:hover{

  color:var(--gold) !important;

  border-color:
    rgba(225,169,62,0.45);

  background:
    rgba(252,248,242,0.50);

  box-shadow:
    0 22px 38px rgba(0,0,0,0.10),
    0 0 0 1px rgba(225,169,62,0.10);

}

/* ========================================== */
/* FOOTER */
/* ========================================== */

.footer{

  margin-top:40px;

  opacity:.5;

  font-size:13px;

  font-weight:500;

}

/* ========================================== */
/* MOBILE */
/* ========================================== */

@media(max-width:600px){

  .logoWrap{

    min-height:120px;

  }

  .logo{

    width:200px;

  }

  .iconGrid{

    gap:20px;

  }

  .iconBtn{

    width:88px;
    height:88px;

    border-radius:26px;

    font-size:38px;

  }

  .full-width-btn{

    height:84px;

    font-size:16px;

  }

  .controls{

    height:74px;

    padding:0 18px;

  }

  .controls div{

    width:52px;
    height:52px;

    font-size:24px;

  }

}

</style>

</head>

<script>

/* ========================================== */
/* ELEMENTS */
/* ========================================== */

const body =
  document.body;

const themeBtn =
  document.getElementById(
    "themeBtn"
  );

const webText =
  document.getElementById(
    "webText"
  );

const newsText =
  document.getElementById(
    "newsText"
  );

const mainHeader =
  document.getElementById(
    "mainHeader"
  );

const controlsEl =
  document.querySelector(
    ".controls"
  );

/* ========================================== */
/* CONTROLS MINI */
/* ========================================== */

let controlsTimer;

function expandControls(){

  controlsEl.classList.remove(
    "controls-mini"
  );

  clearTimeout(
    controlsTimer
  );

}

function resetControlsTimer(){

  expandControls();

  controlsTimer = setTimeout(

    () => {

      controlsEl.classList.add(
        "controls-mini"
      );

    },

    2500

  );

}

window.addEventListener(
  "scroll",
  resetControlsTimer,
  { passive:true }
);

window.addEventListener(
  "touchstart",
  resetControlsTimer,
  { passive:true }
);

controlsEl.addEventListener(
  "mouseenter",
  expandControls
);

controlsEl.addEventListener(
  "mouseleave",
  resetControlsTimer
);

resetControlsTimer();

/* ========================================== */
/* LANGUAGE */
/* ========================================== */

const systemLang =
  navigator.language ||
  navigator.userLanguage;

let currentLang =

  systemLang.startsWith("ar")
  ? "ar"
  : "en";

function updateLabels(){

  document
  .querySelectorAll(
    "[data-ar]"
  )

  .forEach(el => {

    const label =

      el.getAttribute(
        `data-${currentLang}`
      );

    el.setAttribute(
      "data-tooltip",
      label || ""
    );

  });

  webText.innerHTML =

    currentLang === "ar"

    ? "مـــؤســسـة نــديــم"

    : "Nadim Foundation";

  newsText.innerHTML =

    currentLang === "ar"

    ? "اشترك في نشرتنا البريدية"

    : "Subscribe to Our Newsletter";

}

function toggleLang(){

  currentLang =

    currentLang === "ar"
    ? "en"
    : "ar";

  updateLabels();

}

/* ========================================== */
/* THEME */
/* ========================================== */

function applyTheme(){

  const savedTheme =
    localStorage.getItem(
      "theme"
    );

  const prefersDark =

    window.matchMedia(
      "(prefers-color-scheme: dark)"
    ).matches;

  let isLight;

  if (savedTheme){

    isLight =
      savedTheme === "light";

  } else {

    isLight = !prefersDark;

  }

  if (isLight){

    body.classList.add(
      "light"
    );

    themeBtn.innerHTML =
      "🌙";

  } else {

    body.classList.remove(
      "light"
    );

    themeBtn.innerHTML =
      "☀️";

  }

}

function toggleTheme(){

  body.classList.toggle(
    "light"
  );

  const isLight =

    body.classList.contains(
      "light"
    );

  themeBtn.innerHTML =

    isLight
    ? "🌙"
    : "☀️";

  localStorage.setItem(

    "theme",

    isLight
    ? "light"
    : "dark"

  );

}

/* ========================================== */
/* SHARE */
/* ========================================== */

async function shareSite(){

  try{

    if (navigator.share){

      await navigator.share({

        title:
          document.title,

        url:
          location.href

      });

    }

  } catch(err){}

}

/* ========================================== */
/* HEADER SHRINK */
/* ========================================== */

window.addEventListener(

  "scroll",

  () => {

    if (window.scrollY > 50){

      mainHeader.classList.add(
        "shrink"
      );

    } else {

      mainHeader.classList.remove(
        "shrink"
      );

    }

  },

  { passive:true }

);

/* ========================================== */
/* INIT */
/* ========================================== */

window.onload = () => {

  applyTheme();

  updateLabels();

};

window.matchMedia(
  "(prefers-color-scheme: dark)"
)

.addEventListener(

  "change",

  () => {

    if (

      !localStorage.getItem(
        "theme"
      )

    ){

      applyTheme();

    }

  }

);

</script>

</body>
</html>
